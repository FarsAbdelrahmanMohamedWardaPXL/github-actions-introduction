name: Steps Examples

on:
  workflow_dispatch:

jobs:
  steps-example:
    runs-on: ubuntu-latest

    steps:
      - name: Create directory
        run: mkdir testmachine

      - name: Run uname command
        run: uname -a > testmachine/output.txt

      - name: Show file contents
        run: cat testmachine/output.txt

      - name: Show directory listing
        run: ls -alhR
