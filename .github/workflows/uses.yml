name: Uses Examples

on:
  workflow_dispatch:

jobs:
  uses-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download Python script
        run: curl -o my_script.py https://pxl-2tin-devops-resources.github.io/labs/my_script.py

      - name: Run Python script
        run: python my_script.py
